<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eef2ff">
  <title>Minha lista de tarefas</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    :root {
      --bg: #f4f6fb;
      --card: rgba(255,255,255,.88);
      --text: #172033;
      --muted: #75809a;
      --line: #e6eaf2;
      --accent: #6755e8;
      --accent-dark: #5040cb;
      --accent-soft: #eeeaff;
      --danger: #e45468;
      --shadow: 0 20px 55px rgba(35, 42, 75, .10);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background: radial-gradient(circle at 12% 0%, #e9e8ff 0, transparent 34%), var(--bg);
      font: 16px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .app { width: min(100% - 32px, 920px); margin: 0 auto; padding: 55px 0 40px; }
    .hero { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; margin-bottom: 30px; }
    .eyebrow { margin: 0 0 8px; color: var(--accent); font-weight: 800; letter-spacing: .08em; text-transform: uppercase; font-size: .75rem; }
    h1 { margin: 0; font-size: clamp(2rem, 6vw, 3.3rem); letter-spacing: -.055em; line-height: 1; }
    .subtitle { margin: 13px 0 0; color: var(--muted); }
    .date { color: var(--muted); font-size: .88rem; text-align: right; white-space: nowrap; padding-top: 9px; }
    .panel { background: var(--card); border: 1px solid rgba(255,255,255,.75); border-radius: 24px; box-shadow: var(--shadow); backdrop-filter: blur(12px); }
    .composer { display: flex; gap: 12px; padding: 14px; margin-bottom: 20px; }
    .composer input { min-width: 0; flex: 1; border: 0; outline: 0; padding: 12px 14px; color: var(--text); background: transparent; }
    .composer input::placeholder { color: #a4abc0; }
    .primary, .ghost { border: 0; border-radius: 13px; font-weight: 750; transition: .2s ease; }
    .primary { padding: 0 22px; color: white; background: var(--accent); box-shadow: 0 7px 15px rgba(103,85,232,.23); }
    .primary:hover { background: var(--accent-dark); transform: translateY(-1px); }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 22px; border-bottom: 1px solid var(--line); }
    .filters { display: flex; gap: 5px; flex-wrap: wrap; }
    .filter { border: 0; color: var(--muted); background: transparent; padding: 8px 12px; border-radius: 9px; font-weight: 700; }
    .filter:hover, .filter.active { color: var(--accent); background: var(--accent-soft); }
    .clear { border: 0; color: var(--muted); background: transparent; font-size: .87rem; }
    .clear:hover { color: var(--danger); }
    .tasks { padding: 8px 22px 12px; }
    .task { display: flex; align-items: center; gap: 13px; padding: 17px 0; border-bottom: 1px solid var(--line); animation: enter .2s ease both; }
    .task:last-child { border-bottom: 0; }
    .check { appearance: none; flex: 0 0 auto; width: 22px; height: 22px; margin: 0; border: 2px solid #cbd1df; border-radius: 50%; position: relative; transition: .2s; }
    .check:hover { border-color: var(--accent); }
    .check:checked { border-color: var(--accent); background: var(--accent); }
    .check:checked::after { content: "✓"; position: absolute; color: #fff; font-size: 14px; font-weight: 900; left: 3px; top: -3px; }
    .task-text { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    .task.done .task-text { color: #a4abc0; text-decoration: line-through; }
    .task-actions { display: flex; gap: 3px; opacity: 0; transition: opacity .2s; }
    .task:hover .task-actions, .task:focus-within .task-actions { opacity: 1; }
    .icon-btn { width: 32px; height: 32px; border: 0; border-radius: 8px; color: var(--muted); background: transparent; }
    .icon-btn:hover { color: var(--accent); background: var(--accent-soft); }
    .icon-btn.delete:hover { color: var(--danger); background: #fff0f2; }
    .empty { padding: 52px 16px; color: var(--muted); text-align: center; }
    .empty-icon { display: grid; place-items: center; width: 52px; height: 52px; margin: 0 auto 12px; border-radius: 16px; color: var(--accent); background: var(--accent-soft); font-size: 25px; }
    .empty p { margin: 0; }
    .footer { display: flex; justify-content: space-between; gap: 16px; padding: 15px 22px 19px; color: var(--muted); font-size: .86rem; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    @keyframes enter { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
    @media (max-width: 600px) {
      .app { width: min(100% - 20px, 920px); padding-top: 30px; }
      .hero { display: block; margin-bottom: 24px; }
      .date { padding-top: 14px; text-align: left; }
      .composer { padding: 9px; }
      .primary { padding: 0 15px; }
      .toolbar { align-items: flex-start; flex-direction: column; padding: 14px; }
      .tasks { padding: 6px 14px 10px; }
      .task-actions { opacity: 1; }
      .footer { padding-left: 14px; padding-right: 14px; }
    }

    /* Refinamento visual compartilhado com a aplicação principal. */
    :root { --bg: #f6f7fc; --card: rgba(255,255,255,.94); --text: #1b2140; --muted: #7b83a3; --line: #e9eaf3; --accent: #6856e8; --accent-dark: #5542d0; --accent-soft: #efedff; --shadow: 0 24px 70px rgba(46,49,91,.12); --shadow-soft: 0 12px 30px rgba(46,49,91,.08); }
    body { background: radial-gradient(circle at 8% -8%, #e8e5ff 0, transparent 31%), radial-gradient(circle at 100% 22%, #edf3ff 0, transparent 28%), var(--bg); }
    .app { width: min(100% - 40px, 960px); padding: 72px 0 56px; }
    .hero { align-items: flex-end; margin-bottom: 34px; }
    .eyebrow { margin-bottom: 12px; font-size: .72rem; letter-spacing: .14em; }
    h1 { color: #171d3b; font-size: clamp(2.6rem, 7vw, 4.5rem); font-weight: 850; letter-spacing: -.075em; }
    .subtitle { margin-top: 15px; color: #858cab; font-size: 1.02rem; }
    .date { padding: 0 2px 8px 0; color: #7d85a5; font-size: .86rem; font-weight: 650; }
    .panel { border: 1px solid rgba(255,255,255,.9); border-radius: 26px; box-shadow: var(--shadow); }
    .composer { gap: 14px; padding: 12px; margin-bottom: 24px; background: rgba(255,255,255,.88); }
    .composer:focus-within { border-color: rgba(104,86,232,.35); box-shadow: 0 0 0 4px rgba(104,86,232,.09), var(--shadow-soft); }
    .composer input { padding: 15px 17px; font-size: 1rem; }
    .primary { min-height: 50px; padding: 0 25px; border-radius: 15px; font-weight: 800; box-shadow: 0 10px 20px rgba(104,86,232,.25); }
    .primary:hover { box-shadow: 0 13px 24px rgba(104,86,232,.31); }
    .toolbar { padding: 17px 24px; background: rgba(255,255,255,.55); }
    .filters { gap: 7px; }
    .filter { padding: 9px 14px; border-radius: 11px; font-size: .9rem; transition: .2s ease; }
    .filter.active { color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px rgba(104,86,232,.08); }
    .tasks { padding: 10px 24px 14px; }
    .task { min-height: 68px; gap: 15px; padding: 16px 12px; margin: 0 -12px; border-radius: 14px; transition: background .2s ease, transform .2s ease, opacity .25s ease; }
    .task:hover { background: #fafaff; transform: translateX(2px); }
    .check { width: 24px; height: 24px; transition: background .2s ease, border-color .2s ease, transform .2s ease; }
    .check:checked { transform: scale(1.04); }
    .task-text { font-size: .98rem; font-weight: 560; transition: color .25s ease, opacity .25s ease; }
    .task-actions { gap: 5px; }
    .icon-btn { width: 34px; height: 34px; border-radius: 10px; }
    .empty { padding: 70px 16px 76px; }
    .footer { padding: 17px 24px 22px; }
    .footer span:last-child { color: #a5abc0; }
    #page-agent-runtime_agent-panel { left: auto !important; right: 24px !important; bottom: 24px !important; top: auto !important; width: min(360px, calc(100vw - 32px)) !important; min-height: 0 !important; height: auto !important; transform: none !important; overflow: hidden !important; border: 1px solid #e7e4ff !important; border-radius: 20px !important; background: #fff !important; box-shadow: 0 22px 60px rgba(42,37,92,.22) !important; font-family: inherit !important; }
    #page-agent-runtime_agent-panel ._background_1tu05_39 { inset: 0 !important; border-radius: inherit !important; background: #fff !important; }
    #page-agent-runtime_agent-panel:not([class*="_expanded_"]) ._historySectionWrapper_1tu05_246, #page-agent-runtime_agent-panel:not([class*="_expanded_"]) ._inputSectionWrapper_1tu05_539 { display: none !important; }
    #page-agent-runtime_agent-panel [class*="_header_"] { position: relative !important; z-index: 1; display: grid !important; grid-template-columns: 1fr auto; grid-template-areas: "brand controls" "subtitle controls"; align-items: center; min-height: 70px; padding: 13px 14px 12px 17px !important; background: linear-gradient(135deg, #6755e8, #806eff) !important; color: #fff !important; border-radius: 19px !important; }
    #page-agent-runtime_agent-panel [class*="_header_"]::before { content: "Assistente da lista"; grid-area: brand; font-size: .94rem; font-weight: 800; }
    #page-agent-runtime_agent-panel [class*="_header_"]::after { content: "Como posso ajudar?"; grid-area: subtitle; margin-top: 2px; color: rgba(255,255,255,.78); font-size: .73rem; }
    #page-agent-runtime_agent-panel [class*="_statusSection_"] { display: none !important; }
    #page-agent-runtime_agent-panel [class*="_controls_"] { grid-area: controls; align-self: center; }
    #page-agent-runtime_agent-panel [class*="_controlButton_"] { width: 31px !important; height: 31px !important; border: 1px solid rgba(255,255,255,.25) !important; border-radius: 10px !important; color: #fff !important; background: rgba(255,255,255,.14) !important; font-size: 0 !important; }
    #page-agent-runtime_agent-panel [class*="_controlButton_"]:first-child::after { content: "⌄"; font-size: 18px; }
    #page-agent-runtime_agent-panel [class*="_stopButton_"]::after { content: "×"; font-size: 20px; }
    #page-agent-runtime_agent-panel [class*="_historySectionWrapper_"] { position: relative !important; inset: auto !important; max-height: 220px; padding: 12px !important; background: #f8f7ff !important; }
    #page-agent-runtime_agent-panel [class*="_historyItem_"] { border: 1px solid #e9e6ff !important; border-radius: 13px !important; background: #fff !important; color: #6f7695 !important; }
    #page-agent-runtime_agent-panel [class*="_inputSectionWrapper_"] { position: relative !important; inset: auto !important; padding: 10px 12px 12px !important; background: #fff !important; }
    #page-agent-runtime_agent-panel [class*="_inputSection_"] { padding: 0 !important; }
    #page-agent-runtime_agent-panel [class*="_taskInput_"] { width: 100% !important; min-height: 42px; padding: 10px 13px !important; border: 1px solid #e3e1f2 !important; border-radius: 12px !important; color: var(--text) !important; background: #fafaff !important; font: inherit !important; font-size: .84rem !important; }
    #page-agent-runtime_agent-panel [class*="_taskInput_"]::placeholder { color: #9aa0b8 !important; }
    #page-agent-runtime_agent-panel ._background_1tu05_39 { filter: none !important; box-shadow: none !important; }
    #page-agent-runtime_agent-panel [class*="_header_"], #page-agent-runtime_agent-panel [class*="_historySectionWrapper_"], #page-agent-runtime_agent-panel [class*="_inputSectionWrapper_"] { box-shadow: none !important; }
    @media (max-width: 600px) { .app { width: min(100% - 24px, 960px); padding-top: 38px; } h1 { font-size: clamp(2.6rem, 14vw, 3.6rem); } .primary { min-height: 48px; padding: 0 17px; } .toolbar { padding: 15px 16px; } .tasks { padding: 8px 16px 12px; } .footer { padding-left: 16px; padding-right: 16px; } #page-agent-runtime_agent-panel { right: 12px !important; bottom: 12px !important; width: calc(100vw - 24px) !important; } }
  </style>
</head>
<body>
  <main class="app">
    <header class="hero">
      <div>
        <p class="eyebrow">Organize seu dia</p>
        <h1>Minha lista</h1>
        <p class="subtitle">Pequenos passos, grandes resultados.</p>
      </div>
      <time class="date" id="today"></time>
    </header>

    <p role="note" style="margin: 0 0 20px; padding: 12px 16px; border: 1px solid #f0c36d; border-radius: 12px; color: #6b4d00; background: #fff8df; font-weight: 700;">Demonstração com IA externa. Utilize apenas dados fictícios.</p>

    <form class="composer panel" id="task-form">
      <label class="sr-only" for="task-input">Nova tarefa</label>
      <input id="task-input" autocomplete="off" placeholder="O que precisa ser feito?" maxlength="160" required>
      <button class="primary" type="submit">Adicionar</button>
    </form>

    <section class="panel" aria-label="Tarefas">
      <div class="toolbar">
        <nav class="filters" aria-label="Filtrar tarefas">
          <button class="filter active" data-filter="all" type="button">Todas</button>
          <button class="filter" data-filter="active" type="button">Pendentes</button>
          <button class="filter" data-filter="done" type="button">Concluídas</button>
        </nav>
        <button class="clear" id="clear-completed" type="button">Limpar concluídas</button>
      </div>
      <div class="tasks" id="task-list"></div>
      <footer class="footer"><span id="counter">0 tarefas</span><span>Salvo neste dispositivo</span></footer>
    </section>
  </main>

  <script>
    (() => {
      const storageKey = 'minha-lista-de-tarefas-demo-agente-v1';
      const form = document.querySelector('#task-form');
      const input = document.querySelector('#task-input');
      const list = document.querySelector('#task-list');
      const counter = document.querySelector('#counter');
      let filter = 'all';
      let tasks = JSON.parse(localStorage.getItem(storageKey) || '[]');

      document.querySelector('#today').textContent = new Intl.DateTimeFormat('pt-BR', {
        weekday: 'long', day: 'numeric', month: 'long'
      }).format(new Date());

      const save = () => localStorage.setItem(storageKey, JSON.stringify(tasks));
      const visibleTasks = () => tasks.filter(task => filter === 'all' || (filter === 'done' ? task.done : !task.done));

      function render() {
        const visible = visibleTasks();
        list.innerHTML = '';
        if (!visible.length) {
          list.innerHTML = `<div class="empty"><div class="empty-icon">${filter === 'done' ? '✓' : '✦'}</div><p>${filter === 'all' ? 'Sua lista está vazia. Adicione uma tarefa para começar.' : 'Nenhuma tarefa por aqui.'}</p></div>`;
        } else {
          visible.forEach(task => {
            const item = document.createElement('div');
            item.className = `task${task.done ? ' done' : ''}`;
            item.dataset.id = task.id;
            item.innerHTML = `<input class="check" type="checkbox" ${task.done ? 'checked' : ''} aria-label="Concluir tarefa"><span class="task-text"></span><div class="task-actions"><button class="icon-btn edit" type="button" aria-label="Editar tarefa">✎</button><button class="icon-btn delete" type="button" aria-label="Excluir tarefa">×</button></div>`;
            item.querySelector('.task-text').textContent = task.text;
            list.appendChild(item);
          });
        }
        const pending = tasks.filter(task => !task.done).length;
        counter.textContent = `${pending} ${pending === 1 ? 'tarefa pendente' : 'tarefas pendentes'}`;
      }

      form.addEventListener('submit', event => {
        event.preventDefault();
        const text = input.value.trim();
        if (!text) return;
        tasks.unshift({ id: Date.now().toString(), text, done: false });
        save(); render(); input.value = ''; input.focus();
      });

      list.addEventListener('click', event => {
        const item = event.target.closest('.task');
        if (!item) return;
        const task = tasks.find(entry => entry.id === item.dataset.id);
        if (event.target.matches('.check')) { task.done = event.target.checked; save(); render(); }
        if (event.target.matches('.delete')) { tasks = tasks.filter(entry => entry.id !== task.id); save(); render(); }
        if (event.target.matches('.edit')) {
          const updated = prompt('Editar tarefa:', task.text);
          if (updated && updated.trim()) { task.text = updated.trim(); save(); render(); }
        }
      });

      document.querySelectorAll('.filter').forEach(button => button.addEventListener('click', () => {
        filter = button.dataset.filter;
        document.querySelectorAll('.filter').forEach(item => item.classList.toggle('active', item === button));
        render();
      }));

      document.querySelector('#clear-completed').addEventListener('click', () => {
        if (tasks.some(task => task.done)) { tasks = tasks.filter(task => !task.done); save(); render(); }
      });
      render();
    })();
  </script>
  <script
  src="https://cdn.jsdelivr.net/npm/page-agent@1.12.4/dist/iife/page-agent.demo.js"
  crossorigin="anonymous"
  ></script>
  <script>
    (() => {
      const labels = { '准备就绪': 'Pronto para ajudar', '等待任务开始...': 'Pronto para ajudar', '展开历史': 'Mostrar histórico', '关闭': 'Fechar', '输入新任务，详细描述步骤，回车提交': 'Descreva uma tarefa e pressione Enter' };
      const localizeAgent = () => { const root = document.querySelector('#page-agent-runtime_agent-panel'); if (!root) return; root.querySelectorAll('*').forEach(node => { if (node.children.length === 0) { const text = node.textContent.trim(); if (labels[text]) node.textContent = labels[text]; else if (/^[\u3400-\u9fff]/.test(text)) node.textContent = 'Pronto para ajudar'; } if (node instanceof HTMLInputElement && labels[node.placeholder]) node.placeholder = labels[node.placeholder]; if (node instanceof HTMLButtonElement && labels[node.title]) node.title = labels[node.title]; }); };
      new MutationObserver(localizeAgent).observe(document.body, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ['placeholder', 'title'] }); localizeAgent();
    })();
  </script>
</body>
</html>
